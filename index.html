<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Vishnu Krishnakumar Menon - AI/ML Engineer with 4+ years building production LLM, RAG and machine learning systems at C3 AI, Glean and Accenture, specializing in AI reliability, LLM evaluation and scalable inference.">
    <meta name="author" content="Vishnu Krishnakumar Menon">
    <meta name="theme-color" content="#0D3B66">
    <title>Vishnu Krishnakumar Menon | AI/ML Engineer</title>
    <link rel="canonical" href="https://vishnu-k-menon.github.io/">
    <meta property="og:url" content="https://vishnu-k-menon.github.io/">
    <meta property="og:image" content="https://vishnu-k-menon.github.io/assets/images/vishnu-menon.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="assets/css/print.css" media="print" />
    <script src="assets/js/enhance.js" defer></script>
</head>
<body>

    <a class="skip-link mono" href="#top">Skip to content ↓</a>

    <!-- Drawing sheet border + registration marks (decoration only) -->
    <div class="sheet-border" aria-hidden="true"></div>
    <svg class="reg-mark reg-tl" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="6"/><line x1="12" y1="0" x2="12" y2="24"/><line x1="0" y1="12" x2="24" y2="12"/></svg>
    <svg class="reg-mark reg-tr" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="6"/><line x1="12" y1="0" x2="12" y2="24"/><line x1="0" y1="12" x2="24" y2="12"/></svg>
    <svg class="reg-mark reg-bl" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="6"/><line x1="12" y1="0" x2="12" y2="24"/><line x1="0" y1="12" x2="24" y2="12"/></svg>
    <svg class="reg-mark reg-br" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="6"/><line x1="12" y1="0" x2="12" y2="24"/><line x1="0" y1="12" x2="24" y2="12"/></svg>

    <!-- Navigation -->
    <nav class="navbar" id="navbar" aria-label="Primary" hidden>
        <div class="nav-inner">
            <a href="#top" class="brand">
                <span class="brand-mark mono" id="brand-monogram">··</span>
                <span class="brand-name" id="brand-name">Portfolio</span>
                <span class="brand-dwg mono" id="brand-dwg"></span>
            </a>
            <button class="nav-toggle" id="nav-toggle" aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="nav-menu">
                <span></span><span></span><span></span>
            </button>
            <ul class="nav-menu" id="nav-menu"></ul>
        </div>
    </nav>

    <main id="top" tabindex="-1">

        <!-- FIG. 00 — Hero -->
        <section class="hero" id="hero" aria-label="Introduction" hidden>
            <div class="container">
                <p class="hero-dwg mono" id="hero-dwg"></p>

                <div class="dim-wrap" id="dim-wrap">
                    <div class="dim-bar" aria-hidden="true">
                        <span class="dim-tick"></span><span class="dim-line dim-arrow-l"></span>
                        <span class="dim-label mono" id="hero-figure"></span>
                        <span class="dim-line dim-arrow-r"></span><span class="dim-tick"></span>
                    </div>
                    <h1 class="hero-name" id="hero-name">&nbsp;</h1>
                    <div class="dim-bar" aria-hidden="true">
                        <span class="dim-tick"></span><span class="dim-line dim-arrow-l"></span>
                        <span class="dim-label mono" id="hero-dim-label"></span>
                        <span class="dim-line dim-arrow-r"></span><span class="dim-tick"></span>
                    </div>
                </div>

                <div class="hero-body">
                    <div class="hero-text">
                        <p class="hero-title" id="hero-title"></p>

                        <div class="note-box reveal" id="hero-note">
                            <span class="note-tab mono" id="hero-note-label"></span>
                            <p id="hero-summary"></p>
                        </div>

                        <ul class="hero-meta" id="hero-meta"></ul>
                        <div class="hero-cta" id="hero-cta"></div>
                    </div>

                    <!-- FIG. 00-A — Portrait (shown only when hero.photo is set) -->
                    <figure class="hero-photo" id="hero-photo" hidden>
                        <div class="photo-frame">
                            <span class="crop crop-tl" aria-hidden="true"></span>
                            <span class="crop crop-tr" aria-hidden="true"></span>
                            <span class="crop crop-bl" aria-hidden="true"></span>
                            <span class="crop crop-br" aria-hidden="true"></span>
                            <img id="hero-photo-img" alt="" width="640" height="800" fetchpriority="high" decoding="async">
                        </div>
                        <div class="dim-bar" aria-hidden="true">
                            <span class="dim-tick"></span><span class="dim-line dim-arrow-l"></span>
                            <span class="dim-label mono" id="hero-photo-dim"></span>
                            <span class="dim-line dim-arrow-r"></span><span class="dim-tick"></span>
                        </div>
                        <figcaption class="mono" id="hero-photo-caption"></figcaption>
                    </figure>
                </div>
                <div class="hero-readouts" id="hero-readouts"></div>
            </div>
        </section>

        <!-- General Notes — About -->
        <section class="section" id="about" aria-labelledby="about-title" hidden>
            <div class="container">
                <header class="fig-head">
                    <span class="fig-no mono" id="about-figure"></span>
                    <h2 class="fig-title" id="about-title">General Notes</h2>
                    <svg class="fig-rule" aria-hidden="true" viewBox="0 0 100 8" preserveAspectRatio="none"><line class="draw" x1="0" y1="4" x2="100" y2="4" pathLength="1"/></svg>
                </header>
                <div class="about-grid">
                    <ol class="about-notes" id="about-notes"></ol>
                    <dl class="about-specs" id="about-specs"></dl>
                </div>
            </div>
        </section>

        <!-- FIG. 01 — Experience -->
        <section class="section" id="experience" aria-labelledby="experience-title" hidden>
            <div class="container">
                <header class="fig-head">
                    <span class="fig-no mono" id="experience-figure"></span>
                    <h2 class="fig-title" id="experience-title">Service Record</h2>
                    <svg class="fig-rule" aria-hidden="true" viewBox="0 0 100 8" preserveAspectRatio="none"><line class="draw" x1="0" y1="4" x2="100" y2="4" pathLength="1"/></svg>
                </header>
                <svg class="datum-strip" id="datum-strip" viewBox="0 0 1000 96" preserveAspectRatio="xMidYMid meet" aria-hidden="true"></svg>
                <div class="role-grid" id="experience-list"></div>
            </div>
        </section>

        <!-- FIG. 02 — Projects -->
        <section class="section" id="projects" aria-labelledby="projects-title" hidden>
            <div class="container">
                <header class="fig-head">
                    <span class="fig-no mono" id="projects-figure"></span>
                    <h2 class="fig-title" id="projects-title">Project Schematics</h2>
                    <svg class="fig-rule" aria-hidden="true" viewBox="0 0 100 8" preserveAspectRatio="none"><line class="draw" x1="0" y1="4" x2="100" y2="4" pathLength="1"/></svg>
                </header>
                <div class="schematic-grid" id="projects-grid"></div>
            </div>
        </section>

        <!-- FIG. 03 — Skills -->
        <section class="section" id="skills" aria-labelledby="skills-title" hidden>
            <div class="container">
                <header class="fig-head">
                    <span class="fig-no mono" id="skills-figure"></span>
                    <h2 class="fig-title" id="skills-title">Parts Schedule</h2>
                    <svg class="fig-rule" aria-hidden="true" viewBox="0 0 100 8" preserveAspectRatio="none"><line class="draw" x1="0" y1="4" x2="100" y2="4" pathLength="1"/></svg>
                </header>
                <div class="table-scroll">
                    <table class="bp-table" id="skills-table">
                        <thead>
                            <tr><th scope="col" class="mono">REF</th><th scope="col" class="mono">CATEGORY</th><th scope="col" class="mono">ITEMS</th><th scope="col" class="mono th-num">QTY</th></tr>
                        </thead>
                        <tbody id="skills-rows"></tbody>
                    </table>
                </div>
                <p class="table-note mono" id="skills-note"></p>
            </div>
        </section>

        <!-- FIG. 04 — Education & Certifications -->
        <section class="section" id="education" aria-labelledby="education-title" hidden>
            <div class="container">
                <header class="fig-head">
                    <span class="fig-no mono" id="education-figure"></span>
                    <h2 class="fig-title" id="education-title">Revision History</h2>
                    <svg class="fig-rule" aria-hidden="true" viewBox="0 0 100 8" preserveAspectRatio="none"><line class="draw" x1="0" y1="4" x2="100" y2="4" pathLength="1"/></svg>
                </header>
                <div class="table-scroll">
                    <table class="bp-table" id="education-table">
                        <thead>
                            <tr><th scope="col" class="mono">REV</th><th scope="col" class="mono">DATE</th><th scope="col" class="mono">DESCRIPTION</th><th scope="col" class="mono">ISSUED BY</th><th scope="col" class="mono">NOTE</th></tr>
                        </thead>
                        <tbody id="education-rows"></tbody>
                    </table>
                </div>
            </div>
        </section>

        <!-- FIG. 05 — Contact -->
        <section class="section" id="contact" aria-labelledby="contact-title" hidden>
            <div class="container">
                <header class="fig-head">
                    <span class="fig-no mono" id="contact-figure"></span>
                    <h2 class="fig-title" id="contact-title">Contact Detail</h2>
                    <svg class="fig-rule" aria-hidden="true" viewBox="0 0 100 8" preserveAspectRatio="none"><line class="draw" x1="0" y1="4" x2="100" y2="4" pathLength="1"/></svg>
                </header>
                <p class="contact-sub" id="contact-subtitle"></p>
                <div class="email-row" id="email-row">
                    <a class="contact-email" id="contact-email" href="#contact">&nbsp;</a>
                    <span class="email-hint mono" id="email-hint" aria-hidden="true"></span>
                </div>
                <div class="contact-grid" id="contact-grid"></div>
                <ul class="contact-channels" id="contact-channels"></ul>
            </div>
        </section>

    </main>

    <!-- Title block footer -->
    <footer class="footer" id="footer" hidden>
        <div class="container footer-inner">
            <div class="footer-colophon">
                <p class="mono" id="footer-credit"></p>
                <p class="mono" id="footer-copyright"></p>
            </div>
            <div class="title-block mono" id="title-block" aria-label="Drawing title block"></div>
        </div>
    </footer>

    <script src="assets/js/main.js"></script>
</body>
</html>
