<path d="M36 132H176V172H44l-8 6z" fill="#EAF3FB" fill-opacity="0.06" stroke="#EAF3FB" stroke-opacity="0.6"/>
<text x="44" y="144">A multi-tenant LLM</text><text x="44" y="155">+ RAG platform at</text><text x="44" y="166">1M+ requests/day.</text>
<path d="M202 186H70V214H194l8 6z" fill="#9FDBFF" fill-opacity="0.08" stroke="#9FDBFF" stroke-opacity="0.7"/>
