<rect x="36" y="232" width="166" height="30" fill="none" stroke="#EAF3FB" stroke-opacity="0.6" stroke-dasharray="4 3"/>
<text x="46" y="251" font-size="7.5" fill="#A9C7E0">Gradio UI · Hugging Face</text>
</g>
<path d="M218 176H250" stroke="#EAF3FB" stroke-width="1.2" marker-end="url(#ar)"/>
