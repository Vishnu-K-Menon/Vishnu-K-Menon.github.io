<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="AI Career Digital Twin schematic: recruiter chat answered from a grounded persona, with tools that log unknown questions and capture contacts">
<defs>
