<rect width="640" height="360" fill="#0A2F52"/><rect width="640" height="360" fill="url(#g1)"/><rect width="640" height="360" fill="url(#g2)"/>
<g font-family="'IBM Plex Mono', Consolas, 'Courier New', monospace" fill="#EAF3FB">
<text x="24" y="30" font-size="9" letter-spacing="2" fill="#A9C7E0">PN-04 · CAREER DIGITAL TWIN · AGENT</text>
