<circle cx="338" cy="168" r="26" fill="none" stroke="#9FDBFF" stroke-opacity="0.9"/>
<text x="338" y="166" font-size="8" text-anchor="middle">LLM</text><text x="338" y="177" font-size="6.5" text-anchor="middle" fill="#A9C7E0">tool calls</text>
<path d="M366 160a32 32 0 0 1 0 18" fill="none" stroke="#EAF3FB" stroke-opacity="0.6" marker-end="url(#ar)"/>
<text x="388" y="171" font-size="6.5" fill="#A9C7E0">loop</text>
<path d="M338 194V210" stroke="#EAF3FB" stroke-opacity="0.82" marker-end="url(#ar)"/>
<rect x="272" y="216" width="132" height="44" fill="none" stroke="#EAF3FB" stroke-opacity="0.82"/>
<text x="282" y="231" font-size="7.5">record_unknown_</text><text x="282" y="241" font-size="7.5">question()</text><text x="282" y="253" font-size="7.5" fill="#9FDBFF">record_user_details()</text>
</g>
<path d="M422 238H452" stroke="#EAF3FB" stroke-width="1.2" marker-end="url(#ar)"/>
