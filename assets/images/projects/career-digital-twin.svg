<text x="24" y="342" font-size="8" letter-spacing="2" fill="#A9C7E0">OPENAI FUNCTION CALLING · GRADIO · PYPDF · PUSHOVER</text>
<text x="616" y="342" font-size="8" letter-spacing="2" text-anchor="end" fill="#A9C7E0">SCALE 1:1</text>
