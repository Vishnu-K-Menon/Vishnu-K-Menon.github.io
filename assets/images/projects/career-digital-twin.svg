<text x="460" y="236" font-size="7.5" fill="#A9C7E0">Pushover API</text>
<text x="460" y="250" font-size="7" fill="#A9C7E0">unknowns → next</text>
<text x="460" y="262" font-size="7" fill="#A9C7E0">summary revision</text>
