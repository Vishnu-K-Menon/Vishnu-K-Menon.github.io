<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="TheraMind schematic: patient intake chat turned into a SOAP note by one fine-tuned model">
<defs>
<pattern id="g1" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M16 0H0V16" fill="none" stroke="#EAF3FB" stroke-opacity="0.05"/></pattern>
<pattern id="g2" width="80" height="80" patternUnits="userSpaceOnUse"><path d="M80 0H0V80" fill="none" stroke="#EAF3FB" stroke-opacity="0.1"/></pattern>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1.5L9 5L0 8.5z" fill="#EAF3FB"/></marker>
</defs>
<rect width="640" height="360" fill="#0A2F52"/><rect width="640" height="360" fill="url(#g1)"/><rect width="640" height="360" fill="url(#g2)"/>
<g font-family="'IBM Plex Mono', Consolas, 'Courier New', monospace" fill="#EAF3FB">
<text x="24" y="30" font-size="9" letter-spacing="2" fill="#A9C7E0">PN-02 · THERAMIND · DUAL-MODE CLINICAL AGENT</text>
<path d="M24 40H616" stroke="#EAF3FB" stroke-opacity="0.38"/>
<!-- mode 1 -->
<text x="24" y="66" font-size="8" letter-spacing="1.5" fill="#A9C7E0">MODE 1 · PATIENT INTAKE</text>
<rect x="24" y="76" width="216" height="200" fill="none" stroke="#EAF3FB" stroke-opacity="0.82"/>
<g font-size="8">
<path d="M36 90H176V118H44l-8 6z" fill="#EAF3FB" fill-opacity="0.06" stroke="#EAF3FB" stroke-opacity="0.6"/>
<text x="44" y="102">What brings you in</text><text x="44" y="113">today?</text>
<path d="M228 132H90V160H220l8 6z" fill="#9FDBFF" fill-opacity="0.08" stroke="#9FDBFF" stroke-opacity="0.7"/>
<text x="98" y="144">Headaches for two</text><text x="98" y="155">weeks, worse at AM.</text>
<path d="M36 174H176V202H44l-8 6z" fill="#EAF3FB" fill-opacity="0.06" stroke="#EAF3FB" stroke-opacity="0.6"/>
<text x="44" y="186">Any vision changes</text><text x="44" y="197">or nausea?</text>
<rect x="36" y="222" width="192" height="40" fill="none" stroke="#EAF3FB" stroke-opacity="0.82" stroke-dasharray="5 4"/>
<text x="46" y="238" font-size="7" letter-spacing="1" fill="#A9C7E0">GUARDRAIL · RED-FLAG OVERRIDE</text>
<text x="46" y="252" font-size="7.5">crushing chest pain → call 911</text>
</g>
<!-- model core -->
<path d="M244 176H276" stroke="#EAF3FB" stroke-width="1.2" marker-end="url(#ar)"/>
<circle cx="318" cy="176" r="38" fill="none" stroke="#EAF3FB" stroke-opacity="0.82"/>
<circle cx="318" cy="176" r="28" fill="none" stroke="#EAF3FB" stroke-opacity="0.38" stroke-dasharray="3 3"/>
<text x="318" y="172" font-size="8.5" text-anchor="middle">Llama 3.2</text><text x="318" y="184" font-size="8.5" text-anchor="middle">3B</text>
<text x="318" y="230" font-size="7" text-anchor="middle" fill="#A9C7E0">QLoRA SFT + DPO β=0.1</text>
<text x="318" y="242" font-size="7" text-anchor="middle" fill="#A9C7E0">ChromaDB RAG</text>
<path d="M318 120V138" stroke="#EAF3FB" stroke-opacity="0.6" stroke-dasharray="2 2"/>
<text x="318" y="114" font-size="7" text-anchor="middle" fill="#A9C7E0">1 CLICK · SWITCH MODE</text>
<path d="M360 176H392" stroke="#EAF3FB" stroke-width="1.2" marker-end="url(#ar)"/>
<!-- mode 2 -->
<text x="400" y="66" font-size="8" letter-spacing="1.5" fill="#A9C7E0">MODE 2 · SOAP NOTE</text>
<rect x="400" y="76" width="216" height="128" fill="none" stroke="#EAF3FB" stroke-opacity="0.82"/>
<g font-size="8">
<rect x="412" y="88" width="16" height="16" fill="none" stroke="#9FDBFF"/><text x="420" y="99.5" text-anchor="middle" fill="#9FDBFF">S</text><text x="438" y="99.5">2-wk headaches, AM</text>
<rect x="412" y="116" width="16" height="16" fill="none" stroke="#9FDBFF"/><text x="420" y="127.5" text-anchor="middle" fill="#9FDBFF">O</text><text x="438" y="127.5">intermittent blurring</text>
<rect x="412" y="144" width="16" height="16" fill="none" stroke="#9FDBFF"/><text x="420" y="155.5" text-anchor="middle" fill="#9FDBFF">A</text><text x="438" y="155.5">tension vs secondary</text>
<rect x="412" y="172" width="16" height="16" fill="none" stroke="#9FDBFF"/><text x="420" y="183.5" text-anchor="middle" fill="#9FDBFF">P</text><text x="438" y="183.5">eye exam, BP, 1 wk</text>
</g>
<!-- metric -->
<text x="400" y="226" font-size="8" letter-spacing="1.5" fill="#A9C7E0">ROUGE-L</text>
<path d="M400 268H616" stroke="#EAF3FB" stroke-opacity="0.82" marker-start="url(#ar)" marker-end="url(#ar)"/>
<path d="M400 260V276M616 260V276" stroke="#EAF3FB" stroke-opacity="0.82"/>
<text x="400" y="254" font-size="22" font-weight="600" fill="#A9C7E0">0.40</text>
<text x="616" y="254" font-size="26" font-weight="600" text-anchor="end" fill="#9FDBFF">0.78</text>
<text x="508" y="292" font-size="7" text-anchor="middle" fill="#A9C7E0">9,250 dialogues · 19.5 min · RTX 4090</text>
<path d="M24 324H616" stroke="#EAF3FB" stroke-opacity="0.38"/>
<text x="24" y="342" font-size="8" letter-spacing="2" fill="#A9C7E0">FASTAPI · DOCKER · HUGGING FACE SPACES</text>
<text x="616" y="342" font-size="8" letter-spacing="2" text-anchor="end" fill="#A9C7E0">SCALE 1:1</text>
</g>
</svg>
