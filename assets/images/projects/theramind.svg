<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="TheraMind illustration: patient intake chat turned into a SOAP note">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070818"/><stop offset="1" stop-color="#1d1438"/></linearGradient>
<radialGradient id="glow" cx="0.75" cy="0.45" r="0.6"><stop offset="0" stop-color="#B19CD9" stop-opacity="0.24"/><stop offset="1" stop-color="#B19CD9" stop-opacity="0"/></radialGradient>
<radialGradient id="glow2" cx="0.05" cy="1" r="0.7"><stop offset="0" stop-color="#f093fb" stop-opacity="0.16"/><stop offset="1" stop-color="#f093fb" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity="0.045"/></pattern>
<linearGradient id="acc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#B19CD9"/><stop offset="1" stop-color="#f093fb"/></linearGradient>
<marker id="arr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f093fb"/></marker>
</defs>
<rect width="640" height="360" fill="url(#bg)"/>
<rect width="640" height="360" fill="url(#grid)"/>
<rect width="640" height="360" fill="url(#glow)"/>
<rect width="640" height="360" fill="url(#glow2)"/>
<g font-family="'Poppins', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<!-- Intake chat -->
<rect x="32" y="40" width="262" height="270" rx="12" fill="#fff" fill-opacity="0.045" stroke="#fff" stroke-opacity="0.12"/>
<text x="50" y="64" font-size="8" font-weight="800" letter-spacing="1.4" fill="#B19CD9">MODE 1 · PATIENT INTAKE</text>
<rect x="50" y="78" width="176" height="36" rx="10" fill="#B19CD9" fill-opacity="0.16"/>
<text x="62" y="94" font-size="8" fill="#e6edf3">Hi, I'm your intake assistant.</text>
<text x="62" y="106" font-size="8" fill="#e6edf3">What brings you in today?</text>
<rect x="104" y="124" width="172" height="36" rx="10" fill="#4ECDC4" fill-opacity="0.16"/>
<text x="116" y="140" font-size="8" fill="#e6edf3">Headaches for two weeks,</text>
<text x="116" y="152" font-size="8" fill="#e6edf3">worse in the mornings.</text>
<rect x="50" y="170" width="176" height="36" rx="10" fill="#B19CD9" fill-opacity="0.16"/>
<text x="62" y="186" font-size="8" fill="#e6edf3">Any changes in vision or</text>
<text x="62" y="198" font-size="8" fill="#e6edf3">nausea with them?</text>
<rect x="104" y="216" width="172" height="24" rx="10" fill="#4ECDC4" fill-opacity="0.16"/>
<text x="116" y="231" font-size="8" fill="#e6edf3">Some blurriness, no nausea.</text>
<rect x="50" y="254" width="226" height="40" rx="8" fill="#ff6b6b" fill-opacity="0.08" stroke="#ff6b6b" stroke-opacity="0.45" stroke-dasharray="5 4"/>
<text x="62" y="270" font-size="7" font-weight="800" letter-spacing="1" fill="#ff8b94">GUARDRAIL · EMERGENCY OVERRIDE</text>
<text x="62" y="284" font-size="7" fill="#dbe3e7" fill-opacity="0.65">red-flag symptoms break the loop → call 911</text>
<!-- Switch -->
<path d="M300 175 H338" stroke="#f093fb" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="319" y="166" font-size="6.5" font-weight="700" text-anchor="middle" fill="#f093fb">1 click</text>
<!-- SOAP note -->
<rect x="346" y="40" width="262" height="176" rx="12" fill="#fff" fill-opacity="0.045" stroke="#fff" stroke-opacity="0.12"/>
<text x="362" y="64" font-size="8" font-weight="800" letter-spacing="1.4" fill="#f093fb">MODE 2 · DOCTOR SOAP NOTE</text>
<g font-size="7.5" fill="#dbe3e7">
<rect x="362" y="76" width="18" height="18" rx="5" fill="url(#acc)"/><text x="371" y="88.5" font-weight="800" text-anchor="middle" fill="#170c26">S</text>
<text x="390" y="88" fill-opacity="0.8">2-week headaches, AM-predominant</text>
<rect x="362" y="102" width="18" height="18" rx="5" fill="url(#acc)"/><text x="371" y="114.5" font-weight="800" text-anchor="middle" fill="#170c26">O</text>
<text x="390" y="114" fill-opacity="0.8">Reports intermittent blurred vision</text>
<rect x="362" y="128" width="18" height="18" rx="5" fill="url(#acc)"/><text x="371" y="140.5" font-weight="800" text-anchor="middle" fill="#170c26">A</text>
<text x="390" y="140" fill-opacity="0.8">Rule out tension vs. secondary cause</text>
<rect x="362" y="154" width="18" height="18" rx="5" fill="url(#acc)"/><text x="371" y="166.5" font-weight="800" text-anchor="middle" fill="#170c26">P</text>
<text x="390" y="166" fill-opacity="0.8">Eye exam, BP check, follow-up 1 week</text>
</g>
<text x="362" y="200" font-size="7" fill="#dbe3e7" fill-opacity="0.5">Llama 3.2-3B · QLoRA SFT + DPO · ChromaDB RAG</text>
<!-- Metric -->
<rect x="346" y="226" width="262" height="84" rx="12" fill="#B19CD9" fill-opacity="0.09" stroke="#B19CD9" stroke-opacity="0.35"/>
<text x="362" y="248" font-size="8" font-weight="800" letter-spacing="1.4" fill="#B19CD9">ROUGE-L</text>
<text x="362" y="288" font-size="26" font-weight="800" fill="#dbe3e7" fill-opacity="0.55">0.40</text>
<path d="M432 279 H462" stroke="#f093fb" stroke-width="2" marker-end="url(#arr)"/>
<text x="472" y="290" font-size="30" font-weight="800" fill="#f093fb">0.78</text>
<text x="362" y="302" font-size="7" fill="#dbe3e7" fill-opacity="0.55">9,250 clinical dialogues · 19.5 min on one RTX 4090</text>
</g>
<text x="32" y="336" font-family="'Poppins', 'Segoe UI', Arial, sans-serif" font-size="9" font-weight="800" letter-spacing="2" fill="#fff" fill-opacity="0.85">THERAMIND</text>
<text x="112" y="336" font-family="'Poppins', 'Segoe UI', Arial, sans-serif" font-size="8" fill="#dbe3e7" fill-opacity="0.5">Dual-mode clinical LLM agent · live on Hugging Face Spaces</text>
</svg>
